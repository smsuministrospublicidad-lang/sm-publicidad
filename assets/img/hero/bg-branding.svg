<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#0A0A0A"/>
    </linearGradient>
    <radialGradient id="glow2" cx="85%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#E20613" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#E20613" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg2)"/>
  <rect width="1920" height="1080" fill="url(#glow2)"/>

  <!-- overlapping brand shapes -->
  <g opacity="0.9">
    <circle cx="1480" cy="380" r="160" fill="none" stroke="#E20613" stroke-width="2" stroke-opacity="0.55"/>
    <circle cx="1620" cy="480" r="110" fill="#E20613" fill-opacity="0.12" stroke="#E20613" stroke-opacity="0.4" stroke-width="1.5"/>
    <rect x="1300" y="560" width="180" height="180" rx="24" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1.5" transform="rotate(18 1390 650)"/>
    <polygon points="1720,700 1860,780 1720,860 1580,780" fill="#E20613" fill-opacity="0.08" stroke="#E20613" stroke-opacity="0.3" stroke-width="1.5"/>
  </g>

  <!-- swatch strip -->
  <g>
    <rect x="1180" y="860" width="70" height="70" rx="8" fill="#E20613"/>
    <rect x="1260" y="860" width="70" height="70" rx="8" fill="#ffffff" fill-opacity="0.9"/>
    <rect x="1340" y="860" width="70" height="70" rx="8" fill="#2a2a2a" stroke="#ffffff" stroke-opacity="0.15"/>
    <rect x="1420" y="860" width="70" height="70" rx="8" fill="#8a1420"/>
  </g>

  <!-- faint grid -->
  <g stroke="#ffffff" stroke-opacity="0.04">
    <path d="M0,0 L1920,0 M0,120 L1920,120 M0,240 L1920,240 M0,360 L1920,360 M0,480 L1920,480 M0,600 L1920,600 M0,720 L1920,720 M0,840 L1920,840 M0,960 L1920,960"/>
    <path d="M0,0 L0,1080 M240,0 L240,1080 M480,0 L480,1080 M720,0 L720,1080 M960,0 L960,1080 M1200,0 L1200,1080 M1440,0 L1440,1080 M1680,0 L1680,1080"/>
  </g>
</svg>
