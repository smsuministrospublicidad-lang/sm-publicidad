<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#0A0A0A"/>
    </linearGradient>
    <radialGradient id="glow4" cx="82%" cy="25%" r="55%">
      <stop offset="0%" stop-color="#E20613" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#E20613" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="barGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#E20613" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#E20613" stop-opacity="0.65"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg4)"/>
  <rect width="1920" height="1080" fill="url(#glow4)"/>

  <!-- ascending bars -->
  <g>
    <rect x="1180" y="760" width="60" height="180" rx="6" fill="url(#barGrad)"/>
    <rect x="1270" y="680" width="60" height="260" rx="6" fill="url(#barGrad)"/>
    <rect x="1360" y="560" width="60" height="380" rx="6" fill="url(#barGrad)"/>
    <rect x="1450" y="420" width="60" height="520" rx="6" fill="url(#barGrad)"/>
    <rect x="1540" y="300" width="60" height="640" rx="6" fill="url(#barGrad)"/>
    <rect x="1630" y="200" width="60" height="740" rx="6" fill="#E20613" fill-opacity="0.85"/>
  </g>

  <!-- growth line + dots -->
  <g stroke="#ffffff" stroke-opacity="0.35" stroke-width="2" fill="none">
    <path d="M1180,780 L1300,700 L1390,600 L1480,460 L1570,340 L1660,220"/>
  </g>
  <g fill="#ffffff">
    <circle cx="1180" cy="780" r="5"/>
    <circle cx="1300" cy="700" r="5"/>
    <circle cx="1390" cy="600" r="5"/>
    <circle cx="1480" cy="460" r="5"/>
    <circle cx="1570" cy="340" r="5"/>
    <circle cx="1660" cy="220" r="6" fill="#E20613"/>
  </g>

  <!-- scattered data points -->
  <g fill="#E20613" fill-opacity="0.5">
    <circle cx="1080" cy="300" r="4"/>
    <circle cx="1120" cy="450" r="3"/>
    <circle cx="1750" cy="380" r="4"/>
    <circle cx="1800" cy="550" r="3"/>
    <circle cx="1720" cy="150" r="3"/>
  </g>

  <!-- faint grid -->
  <g stroke="#ffffff" stroke-opacity="0.04">
    <path d="M0,0 L1920,0 M0,120 L1920,120 M0,240 L1920,240 M0,360 L1920,360 M0,480 L1920,480 M0,600 L1920,600 M0,720 L1920,720 M0,840 L1920,840 M0,960 L1920,960"/>
    <path d="M0,0 L0,1080 M240,0 L240,1080 M480,0 L480,1080 M720,0 L720,1080 M960,0 L960,1080 M1200,0 L1200,1080 M1440,0 L1440,1080 M1680,0 L1680,1080"/>
  </g>
</svg>
