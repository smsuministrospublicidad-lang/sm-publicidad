<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#0E0E0E"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E20613" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#E20613" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- fondo -->
  <rect width="1200" height="750" fill="url(#bg)"/>
  <circle cx="1050" cy="60" r="280" fill="url(#glow)"/>

  <!-- barra/borde rojo de acento (marca) -->
  <rect x="0" y="0" width="10" height="750" fill="#E20613"/>

  <!-- área para tu foto/captura real -->
  <rect x="60" y="60" width="1080" height="580" rx="18" fill="none" stroke="#E20613" stroke-width="3" stroke-dasharray="14 10"/>
  <text x="600" y="360" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#E20613" text-anchor="middle">
    COLOCA AQUÍ TU FOTO O CAPTURA
  </text>
  <text x="600" y="400" font-family="Arial, sans-serif" font-size="18" fill="#8a8a8a" text-anchor="middle">
    Tamaño lienzo: 1200 × 750 px (16:10) — borra este texto y el marco al insertar tu imagen
  </text>

  <!-- esquina de marca -->
  <rect x="60" y="600" width="180" height="40" rx="8" fill="#E20613"/>
  <text x="150" y="626" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">SM Publicidad</text>
</svg>
